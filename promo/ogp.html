<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<title>和歌ドラフト 宣伝画像</title>
<link href="https://fonts.googleapis.com/css2?family=Shippori+Mincho+B1:wght@500;700;800&family=Zen+Kaku+Gothic+New:wght@500;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/qrcode-generator@1.4.4/qrcode.min.js"></script>
<style>
  /* 1200×630（URLを貼ったときのカード画像の標準サイズ） */
  :root{--bg:#f6f0e2;--paper:#fffdf8;--ink:#1d1b18;--ink2:#55503f;--ink3:#8a8273;--line:#e2d8c4;--shu:#c4402c;--kin:#b08a40;--five:#2f4f6f;--seven:#5f7d2c}
  *{box-sizing:border-box;margin:0}
  html,body{width:1200px;height:630px;overflow:hidden}
  body{background:var(--bg);color:var(--ink);font-family:"Zen Kaku Gothic New",sans-serif;position:relative}
  /* 金の砂子（控えめ） */
  .sunago{position:absolute;inset:0;pointer-events:none;
    background-image:
      radial-gradient(circle,rgba(201,163,90,.35) 0 1.6px,transparent 2.4px),
      radial-gradient(circle,rgba(201,163,90,.25) 0 1.1px,transparent 1.8px);
    background-size:97px 83px,61px 71px;background-position:13px 29px,41px 7px}
  .frame{position:absolute;inset:22px;border:1.5px solid var(--line);border-radius:6px}

  .left{position:absolute;left:70px;top:58px;width:560px}
  .brand{display:flex;align-items:center;gap:16px}
  .seal{width:62px;height:62px;border-radius:8px;background:var(--shu);color:#fff;display:grid;place-items:center;
    font-family:"Shippori Mincho B1",serif;font-weight:800;font-size:34px;transform:rotate(-4deg)}
  h1{font-family:"Shippori Mincho B1",serif;font-weight:800;font-size:66px;letter-spacing:.06em;line-height:1;white-space:nowrap}
  .copy{margin-top:30px;font-family:"Shippori Mincho B1",serif;font-weight:700;font-size:34px;line-height:1.5;letter-spacing:.04em}
  .copy em{font-style:normal;color:var(--shu)}
  .sub{margin-top:14px;font-size:20px;color:var(--ink2);line-height:1.6}

  .steps{position:absolute;left:70px;bottom:48px;display:flex;gap:10px}
  .step{background:var(--paper);border:1.5px solid var(--line);border-radius:10px;padding:10px 14px;width:128px}
  .step b{display:block;font-family:"Shippori Mincho B1",serif;font-size:13px;color:var(--kin);letter-spacing:.15em}
  .step span{display:block;margin-top:2px;font-weight:700;font-size:16px;line-height:1.35}
  .tags{position:absolute;left:70px;bottom:166px;display:flex;gap:8px}
  .tag{font-size:16px;font-weight:700;padding:5px 14px;border-radius:99px;border:1.5px solid var(--ink3);color:var(--ink2);background:var(--paper)}

  /* 色紙 */
  .shikishi{position:absolute;right:250px;top:40px;width:300px;height:410px;background:var(--paper);border:1.5px solid var(--line);border-radius:4px;
    box-shadow:0 0 0 8px #efe6d3,0 0 0 9.5px var(--line),0 22px 40px -24px rgba(80,60,20,.45);transform:rotate(2deg);padding:26px 18px 16px;display:flex;flex-direction:column}
  .shikishi::after{content:"";position:absolute;inset:0;border-radius:4px;pointer-events:none;
    background:radial-gradient(ellipse at 100% 0%,rgba(201,163,90,.22),transparent 40%),radial-gradient(ellipse at 0% 100%,rgba(201,163,90,.18),transparent 42%)}
  .shikishi .th{position:absolute;left:16px;top:10px;font-size:12px;font-weight:700;color:var(--kin);letter-spacing:.1em}
  .shikishi .fm{position:absolute;right:16px;top:10px;font-size:12px;font-weight:700;color:var(--ink3);letter-spacing:.1em}
  .tate{flex:1;writing-mode:vertical-rl;font-family:"Shippori Mincho B1",serif;font-weight:700;font-size:22px;line-height:1.8;letter-spacing:.06em;margin:6px auto 0;padding-bottom:50px}
  .tate span{display:block;position:relative}
  .tate span:nth-child(2){padding-top:1.2em}.tate span:nth-child(3){padding-top:2.4em}.tate span:nth-child(4){padding-top:.6em}.tate span:nth-child(5){padding-top:1.8em}
  .tate small{position:absolute;top:100%;left:0;right:0;margin-top:6px;font-family:"Zen Kaku Gothic New",sans-serif;font-size:11px;font-weight:500;color:var(--ink3);letter-spacing:0;white-space:nowrap}
  .by{display:flex;justify-content:flex-end;align-items:center;gap:8px;border-top:1px solid var(--line);padding-top:10px;font-family:"Shippori Mincho B1",serif;font-weight:700;font-size:16px;color:var(--ink3)}
  .by i{width:24px;height:24px;border-radius:4px;background:var(--ink3);color:#fff;display:grid;place-items:center;font-style:normal;font-size:12px;transform:rotate(-4deg)}

  /* 詠み人当ての吹き出し */
  .guess{position:absolute;right:236px;bottom:40px;width:330px;background:var(--paper);border:1.5px solid var(--line);border-radius:12px;padding:12px 14px;box-shadow:0 10px 22px -16px rgba(80,60,20,.5)}
  .guess .q{font-weight:700;font-size:16px;color:var(--ink2);display:flex;justify-content:space-between}
  .guess .q span{color:var(--ink3);font-weight:500;font-size:14px}
  .gb{display:flex;gap:6px;margin-top:8px}
  .gb div{padding:6px 14px;border-radius:99px;border:1.5px solid var(--line);font-weight:700;font-size:15px}
  .gb .on{background:var(--shu);border-color:var(--shu);color:#fff}

  /* 右端：QR */
  .qrbox{position:absolute;right:60px;top:50%;transform:translateY(-50%);width:150px;text-align:center}
  .qr{background:#fff;border:1.5px solid var(--line);border-radius:10px;padding:8px}
  .qr svg{display:block;width:100%;height:auto}
  .qrbox p{margin-top:8px;font-size:14px;font-weight:700;color:var(--ink2);line-height:1.45}
  .petal{position:absolute;width:16px;height:12px;border-radius:16px 0 16px 0;background:#f2b8c0;opacity:.85}
</style>
</head>
<body>
<div class="sunago"></div>
<div class="frame"></div>

<div class="left">
  <div class="brand"><div class="seal">和</div><h1>和歌ドラフト</h1></div>
  <p class="copy">持ち寄った言葉を回し取り、<br><em>一首ひねる</em>パーティーゲーム。</p>
  <p class="sub">流行語も昨日の夕飯も、五音と七音にすれば歌になる。<br>詠み人は伏せたまま。誰の歌か、当ててみて。</p>
</div>

<div class="tags"><span class="tag">スマホだけ</span><span class="tag">登録いらず</span><span class="tag">3人から</span></div>
<div class="steps">
  <div class="step"><b>一</b><span>五音・七音を<br>書く</span></div>
  <div class="step"><b>二</b><span>回して<br>1枚ずつ取る</span></div>
  <div class="step"><b>三</b><span>手札で<br>一首組む</span></div>
  <div class="step"><b>四</b><span>詠み人を<br>当て合う</span></div>
</div>

<div class="shikishi">
  <span class="th">お題・締め切り</span><span class="fm">短歌</span>
  <div class="tate">
    <span>夜明けまで<small>あかね</small></span>
    <span>締め切りは明日<small>いつき</small></span>
    <span>カレー食う<small>うみ</small></span>
    <span>札束の海<small>いつき</small></span>
    <span>蛙飛び込む<small>あかね</small></span>
  </div>
  <div class="by"><i>詠</i>詠み人は……？</div>
</div>

<div class="guess">
  <div class="q">誰の歌？<span>推理 2/3人</span></div>
  <div class="gb"><div>あかね</div><div class="on">いつき</div><div>うみ</div></div>
</div>

<div class="qrbox"><div class="qr" id="qr"></div><p>読み取って<br>すぐ遊べる</p></div>

<i class="petal" style="left:640px;top:70px;transform:rotate(30deg)"></i>
<i class="petal" style="left:676px;top:120px;transform:rotate(-20deg);background:#f6d0d6"></i>
<i class="petal" style="left:930px;top:40px;transform:rotate(60deg);background:#f3c98b"></i>
<i class="petal" style="left:610px;top:470px;transform:rotate(-40deg);background:#f6d0d6"></i>

<script>
  const q=qrcode(0,"M"); q.addData("https://kageusu100-netizen.github.io/waka-draft/"); q.make();
  document.getElementById("qr").innerHTML=q.createSvgTag({cellSize:4,margin:0,scalable:true});
</script>
</body>
</html>
